name: Publish Docker image

# Builds the netmon container and publishes it to the GitHub Container
# Registry (GHCR) so it can be pulled by a NAS stack manager (Dockge,
# Portainer, Container Manager) without building from source.
#
# Images land at: ghcr.io/<owner>/netmon
#   - pushes to the default branch  -> :latest
#   - version tags (v1.2.3)         -> :1.2.3, :1.2, :1
#   - any branch                    -> :<branch-name>
#
# One-time setup after the first successful run: open the package at
# https://github.com/users/<owner>/packages/container/netmon/settings and set
# its visibility to Public so the NAS can pull it without a login.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name for GHCR automatically.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
