name: Publish Docker image

# Builds the netmon container and publishes it to the GitHub Container
# Registry (GHCR) so it can be pulled by a NAS stack manager (Dockge,
# Portainer, Container Manager) without building from source.
#
# Images land at: ghcr.io/<owner>/netmon
#   - pushes to the default branch  -> :latest
#   - version tags (v1.2.3)         -> :1.2.3, :1.2, :1
#   - any branch                    -> :<branch-name>
#
# One-time setup after the first successful run: open the package at
# https://github.com/users/<owner>/packages/container/netmon/settings and set
# its visibility to Public so the NAS can pull it without a login.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  schedule:
    # Weekly rebuild so Debian security patches (apt-get upgrade) get applied
    # without needing a code change. Refreshes latest + the rolling X / X.Y
    # tags; the exact X.Y.Z tag stays an immutable snapshot.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read the release version straight from pyproject.toml so a push to the
      # default branch publishes matching version tags — no git tag needed
      # (handy when the environment can't push tag refs). Pushing a v* git tag
      # still works too, via the type=semver rules below.
      - name: Read project version
        id: ver
        run: |
          V="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "full=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${V%%.*}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name for GHCR automatically.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.full }},enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.major }},enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
